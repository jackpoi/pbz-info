name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 版本号只有一个来源：app/__init__.py。tag 与它不一致就拒绝发布，
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, pathlib, re, sys
          text = pathlib.Path("app/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)', text)
          version = match.group(1) if match else ""
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if not version or version != tag:
              sys.exit(f"version mismatch: __version__ = {version!r}, tag = {tag!r}")
          print(f"version ok: {version}")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: python -m pip install -r requirements-dev.txt

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Test
        run: python -m pytest tests -q

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash dist\pbz-info.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  pbz-info.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pbz-info
          path: |
            dist/pbz-info.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pbz-info
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: pbz-info ${{ github.ref_name }}
          files: |
            dist/pbz-info.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
